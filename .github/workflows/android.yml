name: Application Android

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Ce qui change dans cette version (affiché aux utilisateurs)"
        required: false
        default: ""
      force:
        description: "Mise à jour obligatoire ? (1 = oui, 0 = non)"
        required: false
        default: "0"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les fichiers Android envoyés (première fois seulement)
        run: |
          if [ -f android-sunrise-space.zip ]; then
            unzip -oq android-sunrise-space.zip
            rm android-sunrise-space.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A android android-sunrise-space.zip
            git commit -m "Ajout de l'application Android" || true
            git push || true
          fi

      - name: Vérifier le fichier Firebase
        run: |
          if [ ! -f android/google-services.json ]; then
            echo "::error::Le fichier android/google-services.json est absent."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Android (licences et plateforme 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sunrise-space-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Préparer le fichier à partager
        run: cp android/build/outputs/apk/debug/*.apk sunrise-space.apk

      - name: Envoyer la mise à jour au serveur
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
          FORCE: ${{ github.event.inputs.force }}
          CODE: ${{ github.run_number }}
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$UPDATE_TOKEN" ]; then
            echo "Secrets SERVER_URL / UPDATE_TOKEN absents : envoi au serveur ignoré."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 300 --retry 5 --retry-delay 20 --retry-all-errors \
            -X POST "$SERVER_URL/api/app/publish" \
            -H "Authorization: Bearer $UPDATE_TOKEN" \
            -F "apk=@sunrise-space.apk" \
            -F "version_code=$CODE" \
            -F "version_name=1.0.$CODE" \
            -F "notes=$NOTES" \
            -F "force=${FORCE:-0}"
